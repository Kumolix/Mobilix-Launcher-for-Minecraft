name: Discover Turnip
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Drivers
        run: |
          for R in K11MCH1/AdrenoToolsDrivers; do
            gh api "repos/$R/releases?per_page=5" -q '.[]|"REL \(.tag_name) \(.published_at[:10])\n"+([.assets[]|"   ASSET \(.name) \(.size/1048576|floor)MB"]|join("\n"))' || true
          done
      - name: libadrenotools
        run: |
          git clone --recursive -q https://github.com/bylaws/libadrenotools.git
          cd libadrenotools; git log --oneline -1; ls; echo ---; cat CMakeLists.txt; echo ---; cat include/adrenotools/driver.h | head -120; ls lib lib/linkernsbypass 2>/dev/null
