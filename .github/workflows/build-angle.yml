name: Build ANGLE (arm64)
# Собирает ANGLE (OpenGL ES поверх Vulkan, BSD-3, Google) из исходников для Android arm64:
# libEGL_angle.so и libGLESv2_angle.so. Их использует MobileGlues (MG_ANGLE_DIR, enableANGLE).
# Результат кладётся в ветку runtime-libs (angle/arm64-v8a), не в релиз. Сборка долгая (1-2 часа).
on:
  workflow_dispatch:
  push:
    branches: [labs-refactor]
    paths: ['.github/workflows/build-angle.yml']
permissions:
  contents: write
jobs:
  angle:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          df -h /

      - name: depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /opt/depot_tools
          echo "/opt/depot_tools" >> "$GITHUB_PATH"

      - name: Fetch ANGLE sources (newest chromium/* branch)
        run: |
          export PATH="/opt/depot_tools:$PATH"
          mkdir -p /opt/src && cd /opt/src
          BR=$(git ls-remote --heads https://chromium.googlesource.com/angle/angle 'refs/heads/chromium/*' | sed 's#.*refs/heads/chromium/##' | grep -E '^[0-9]+$' | sort -n | tail -1)
          echo "ANGLE branch: chromium/$BR"
          echo "$BR" > /opt/src/angle-branch.txt
          git clone --depth 1 -b "chromium/$BR" https://chromium.googlesource.com/angle/angle angle
          cd angle
          python3 scripts/bootstrap.py
          echo 'target_os = ["android"]' >> .gclient
          gclient sync --no-history -j8 -D 2>&1 | tail -40
          df -h /

      - name: Build libEGL_angle.so and libGLESv2_angle.so
        run: |
          export PATH="/opt/depot_tools:$PATH"
          cd /opt/src/angle
          gn gen out/arm64 --args='target_os="android" target_cpu="arm64" is_debug=false is_component_build=false symbol_level=0 angle_libs_suffix="_angle" angle_enable_vulkan=true angle_enable_gl=false angle_enable_null=false angle_enable_swiftshader=false android64_ndk_api_level=26'
          gn ls out/arm64 | grep -iE 'libEGL|libGLESv2' || true
          autoninja -C out/arm64 libEGL libGLESv2
          find out/arm64 -maxdepth 1 -name '*.so' -exec ls -la {} \;

      - name: Check libraries
        run: |
          cd /opt/src/angle/out/arm64
          test -f libEGL_angle.so && test -f libGLESv2_angle.so
          RE=$(command -v llvm-readelf || command -v readelf)
          for f in libEGL_angle.so libGLESv2_angle.so; do echo "--- $f"; "$RE" -d "$f" | grep -E 'NEEDED|SONAME'; done

      - name: Publish to branch runtime-libs (angle/arm64-v8a)
        run: |
          git clone -q --depth 1 -b runtime-libs "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/rl
          mkdir -p /tmp/rl/angle/arm64-v8a
          cp /opt/src/angle/out/arm64/libEGL_angle.so /opt/src/angle/out/arm64/libGLESv2_angle.so /tmp/rl/angle/arm64-v8a/
          cp /opt/src/angle/LICENSE /tmp/rl/angle/LICENSE
          echo "ANGLE chromium/$(cat /opt/src/angle-branch.txt), android arm64, Vulkan backend, built by build-angle.yml" > /tmp/rl/angle/version.txt
          ls -la /tmp/rl/angle/arm64-v8a
          cd /tmp/rl
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add angle
          git commit -qm "ANGLE arm64 (generated by build-angle.yml)"
          git push origin runtime-libs
