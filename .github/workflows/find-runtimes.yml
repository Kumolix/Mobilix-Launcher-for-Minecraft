name: Find Android runtimes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect runtime layout in the PojavLauncher release APK
        run: |
          curl -fsSL https://github.com/PojavLauncherTeam/PojavLauncher/releases/download/gladiolus/PojavLauncher.apk -o /tmp/p.apk
          mkdir -p /tmp/x && cd /tmp/x && unzip -q /tmp/p.apk 'assets/components/jre*/*' 'assets/components/jre*/version'
          for d in jre jre-new jre-21; do
            echo "=== $d: version=$(cat assets/components/$d/version)"
            for f in universal bin-arm bin-x86_64; do
              echo "--- $d/$f (top levels)"
              tar -tJf assets/components/$d/$f.tar.xz | awk -F/ 'NF<=3' | head -40
            done
          done
          echo "=== libjvm / java binaries"
          for d in jre jre-new jre-21; do for f in bin-arm bin-x86_64; do echo "-- $d/$f"; tar -tJf assets/components/$d/$f.tar.xz | grep -E "libjvm|/bin/java$|libjava.so|release$|libfreetype|libawt" | head; done; done
