name: Find renderer binaries
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "https://api.github.com/repos/MobileGL-Dev/MobileGlues-release/releases?per_page=4" | python3 -c "
          import sys,json
          for r in json.load(sys.stdin):
            print('REL', r['tag_name'], [(a['name'],a['size']) for a in r['assets']])"
          URL=$(curl -fsS "https://api.github.com/repos/MobileGL-Dev/MobileGlues-release/releases?per_page=5" | python3 -c "
          import sys,json
          for r in json.load(sys.stdin):
            for a in r['assets']:
              if a['name'].endswith('.apk') and 'mobileglues' in a['name'].lower(): print(a['browser_download_url']); raise SystemExit")
          echo "APK $URL"
          curl -fsSL "$URL" -o /tmp/mg.apk
          unzip -l /tmp/mg.apk | grep -E "\.so|assets" | awk '{print $1, $4}' | head -60
          echo "--- Pojav OSMesa / zink bits"
          curl -fsSL https://github.com/PojavLauncherTeam/PojavLauncher/releases/download/gladiolus/PojavLauncher.apk -o /tmp/p.apk
          unzip -l /tmp/p.apk | grep -i -E "osmesa|zink|vulkan|angle|ltw|mesa" | awk '{print $1, $4}'
