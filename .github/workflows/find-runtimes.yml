name: Find Android runtimes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: List runtimes inside the PojavLauncher release APK
        run: |
          URL=$(curl -fsS "https://api.github.com/repos/PojavLauncherTeam/PojavLauncher/releases?per_page=3" | python3 -c "
          import sys,json
          for r in json.load(sys.stdin):
            for a in r['assets']:
              if a['name'].endswith('.apk'): print(a['browser_download_url']); raise SystemExit")
          echo "APK: $URL"
          curl -fsSL "$URL" -o /tmp/p.apk
          unzip -l /tmp/p.apk | grep -i -E "assets/components|jre|runtime|\.tar\.xz" | head -80
          unzip -l /tmp/p.apk | grep -E "lib/" | awk '{print $4}' | cut -d/ -f2 | sort | uniq -c
