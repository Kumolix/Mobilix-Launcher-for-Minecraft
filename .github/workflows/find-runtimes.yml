name: Find Android runtimes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: List runtime archives in Pojav repos
        run: |
          for R in PojavLauncherTeam/PojavLauncher PojavLauncherTeam/android-openjdk-build-multiarch; do
            echo "::group::$R"
            git clone -q --depth 1 "https://github.com/$R.git" /tmp/r >/dev/null 2>&1 && {
              (cd /tmp/r; git log -1 --format=%H; find . -path ./.git -prune -o \( -name "*.tar.xz" -o -name "*.tar.gz" -o -name "*.zip" \) -printf "%s %p\n" | head -60; ls)
            } || echo "clone failed"
            rm -rf /tmp/r
            echo "::endgroup::"
          done
          echo "== releases"
          for R in PojavLauncherTeam/PojavLauncher PojavLauncherTeam/android-openjdk-build-multiarch; do
            curl -fsS "https://api.github.com/repos/$R/releases?per_page=8" | python3 -c "
          import sys,json
          for r in json.load(sys.stdin):
            print('$R', r['tag_name'], [(a['name'],a['size']) for a in r['assets']][:12])"
          done
