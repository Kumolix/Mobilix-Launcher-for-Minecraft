name: Analyze OSMesa
on: workflow_dispatch
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - name: Strings
        run: |
          curl -sL -o osmesa.so "https://github.com/${{ github.repository }}/releases/download/libraries/pojav-osmesa-arm64.so"
          OD=$(ls $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump)
          $OD -s --start-address=0x9ec80 --stop-address=0x9ecd0 osmesa.so
          $OD -s --start-address=0x92df0 --stop-address=0x92e30 osmesa.so
          strings -a osmesa.so | grep -i "POJAV\|MESA_GL\|VK_\|LIBGL" | sort -u | head -40
