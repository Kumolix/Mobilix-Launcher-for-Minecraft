name: Build SDL3 (arm64)
# Собирает настоящую SDL3 (libsdl-org/SDL, лицензия zlib) для Android arm64: libSDL3.so. Нужна Minecraft 26.3+,
# где LWJGL использует SDL вместо GLFW. Результат кладётся в ветку runtime-libs (sdl3/arm64-v8a), приложение скачивает его при запуске.
on:
  workflow_dispatch:
  push:
    branches: [labs-refactor]
    paths: ['.github/workflows/build-sdl3.yml']
permissions:
  contents: write
env:
  SDL_TAG: release-3.4.20
jobs:
  sdl3:
    runs-on: ubuntu-latest
    steps:
      - name: Build libSDL3.so
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          git clone -q --depth 1 --branch "$SDL_TAG" https://github.com/libsdl-org/SDL.git /tmp/sdl
          cmake -S /tmp/sdl -B /tmp/sdl/b -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_INSTALL=OFF \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384" > /tmp/sdl-cmake.log 2>&1 || { tail -40 /tmp/sdl-cmake.log; exit 1; }
          cmake --build /tmp/sdl/b -j4 > /tmp/sdl-build.log 2>&1 || { grep -E "error|Error" /tmp/sdl-build.log | head -30; exit 1; }
          F=$(find /tmp/sdl/b -name libSDL3.so | head -1)
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded "$F"
          mkdir -p /tmp/out && cp "$F" /tmp/out/libSDL3.so
          ls -la /tmp/out

      - name: Check library
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          RE="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$RE" -d /tmp/out/libSDL3.so | grep -E 'NEEDED|SONAME'
          "$RE" --dyn-syms /tmp/out/libSDL3.so > /tmp/syms.txt
          grep -E 'SDL_Init|SDL_CreateWindow|SDL_GL_CreateContext|JNI_OnLoad' /tmp/syms.txt | head
          grep -q 'SDL_Init' /tmp/syms.txt && grep -q 'SDL_CreateWindow' /tmp/syms.txt

      - name: Publish to branch runtime-libs (sdl3/arm64-v8a)
        run: |
          git clone -q --depth 1 -b runtime-libs "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/rl
          mkdir -p /tmp/rl/sdl3/arm64-v8a
          cp /tmp/out/libSDL3.so /tmp/rl/sdl3/arm64-v8a/
          cp /tmp/sdl/LICENSE.txt /tmp/rl/sdl3/LICENSE.txt
          echo "SDL $SDL_TAG, android arm64, built by build-sdl3.yml" > /tmp/rl/sdl3/version.txt
          cd /tmp/rl
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdl3
          git commit -qm "SDL3 arm64 (generated by build-sdl3.yml)"
          git push origin runtime-libs
