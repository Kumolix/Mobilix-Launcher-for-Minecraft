name: Mirror Android runtimes
# Копирует готовые сборки OpenJDK под Android (Java 8 / 17 / 21 для arm, arm64, x86, x86_64) из релизного APK PojavLauncher
# в релиз "libraries" этого репозитория, чтобы лаунчер скачивал их с нашего адреса.
# OpenJDK: GPLv2 + Classpath Exception; сборки: PojavLauncherTeam/android-openjdk-build-multiarch.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Extract runtimes from the PojavLauncher APK
        run: |
          curl -fsSL https://github.com/PojavLauncherTeam/PojavLauncher/releases/download/gladiolus/PojavLauncher.apk -o /tmp/p.apk
          mkdir -p /tmp/x /tmp/out && cd /tmp/x && unzip -q /tmp/p.apk 'assets/components/jre*/*'
          for pair in jre:jre8 jre-new:jre17 jre-21:jre21; do
            src=${pair%%:*}; dst=${pair##*:}
            for f in universal bin-arm bin-arm64 bin-x86 bin-x86_64; do
              cp "assets/components/$src/$f.tar.xz" "/tmp/out/pojav-$dst-$f.tar.xz"
            done
            cp "assets/components/$src/version" "/tmp/out/pojav-$dst-version.txt"
          done
          # нативы LWJGL (liblwjgl*.so) под каждый ABI: для arm / x86 / x86_64 (arm64 берётся из других источников)
          for pair in armeabi-v7a:arm x86:x86 x86_64:x86_64; do
            a=${pair%%:*}; id=${pair##*:}
            mkdir -p /tmp/nat/$id && unzip -q -j /tmp/p.apk "lib/$a/liblwjgl*.so" -d /tmp/nat/$id
            (cd /tmp/nat/$id && zip -q /tmp/out/pojav-lwjgl-natives-$id.zip *.so)
          done
          ls -la /tmp/out
      - name: Java 25 (MDTCopper/android-openjdk, same universal + bin-<abi> layout)
        run: |
          curl -fsS https://api.github.com/repos/MDTCopper/android-openjdk/releases/tags/jre25 -o /tmp/r25.json
          python3 - <<'PY'
          import json,urllib.request,re
          r=json.load(open('/tmp/r25.json'))
          for a in r['assets']:
            n=a['name']; print('asset',n,a['size'])
            m=None
            if n=='universal.tar.xz': dst='pojav-jre25-universal.tar.xz'
            elif n=='version': dst='pojav-jre25-version.txt'
            else:
              m=re.match(r'bin-(.+)\.tar\.xz$',n)
              if not m: continue
              k={'aarch64':'arm64','arm64':'arm64','arm':'arm','aarch32':'arm','x86_64':'x86_64','x86':'x86','i686':'x86'}.get(m.group(1))
              if not k: print('  unknown arch',m.group(1)); continue
              dst='pojav-jre25-bin-%s.tar.xz'%k
            urllib.request.urlretrieve(a['browser_download_url'],'/tmp/out/'+dst); print('  ->',dst)
          PY
          ls -la /tmp/out | grep jre25
      - name: Upload to release "libraries"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view libraries >/dev/null 2>&1 || gh release create libraries --title "Libraries backup" --notes "Копии JRE, нативов LWJGL и MobileGlues" --prerelease
          gh release upload libraries /tmp/out/* --clobber
          gh release view libraries --json assets --jq '.assets[]|[.name,.size,.url]|@tsv' | grep pojav
