name: Build APK

permissions:
  contents: write

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Build native libraries (arm64)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          echo "::notice::NDK=$NDK cc_exists=$(test -x "$CC" && echo yes || echo no) os=$(. /etc/os-release; echo "$PRETTY_NAME")"
          OUT=app/src/main/jniLibs/arm64-v8a
          mkdir -p "$OUT"
          set +e
          {
            "$CC" -shared -fPIC -O2 -o "$OUT/libnotag.so" native/notag.c &&
            "$CC" -shared -fPIC -O2 -Wl,-soname,libglfw.so -o "$OUT/libglfw.so" native/glfw.c -llog -landroid -lEGL -ldl &&
            "$CC" -shared -fPIC -O2 -o "$OUT/libmobilix.so" native/mobilix.c -L"$OUT" -lglfw -llog -landroid -lEGL -lGLESv2 -ldl
          } > native-build.log 2>&1
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "::error::native build failed rc=$RC: $(head -c 1800 native-build.log | tr '\n' '|')"
            exit $RC
          fi

      - name: Build 32-bit stub (lets the APK install on armeabi-v7a devices)
        continue-on-error: true
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang"
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          "$CC" -shared -fPIC -O2 -o app/src/main/jniLibs/armeabi-v7a/libstub32.so native/stub32.c

      - name: Build OpenAL Soft (arm64)
        continue-on-error: true
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          OUT="$PWD/app/src/main/jniLibs/arm64-v8a"
          git clone --depth 1 --branch 1.23.1 https://github.com/kcat/openal-soft.git /tmp/oal > /tmp/oal-build.log 2>&1
          cmake -S /tmp/oal -B /tmp/oal/build -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=26 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
            -DLIBTYPE=SHARED -DALSOFT_UTILS=OFF -DALSOFT_EXAMPLES=OFF -DALSOFT_TESTS=OFF -DALSOFT_INSTALL=OFF >> /tmp/oal-build.log 2>&1 &&
          cmake --build /tmp/oal/build -j4 >> /tmp/oal-build.log 2>&1
          RC=$?
          F=$(ls /tmp/oal/build/libopenal.so* 2>/dev/null | head -1)
          if [ $RC -eq 0 ] && [ -n "$F" ]; then
            cp -L "$F" "$OUT/libopenal.so"
            echo "::notice::openal built: $(ls -la $OUT/libopenal.so)"
          else
            echo "::warning::openal build failed rc=$RC: $(tail -c 1500 /tmp/oal-build.log | tr '\n' '|')"
          fi

      - name: Build gl4es (renderer for old Minecraft versions)
        continue-on-error: true
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          OUT="$PWD/app/src/main/jniLibs/arm64-v8a"
          git clone --depth 1 https://github.com/ptitSeb/gl4es.git /tmp/gl4es > /tmp/gl4es-build.log 2>&1
          cmake -S /tmp/gl4es -B /tmp/gl4es/build -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=26 -DCMAKE_BUILD_TYPE=Release -DANDROID=ON -DNOX11=ON -DNO_GBM=ON \
            -DNOEGL=ON -DNO_INIT_CONSTRUCTOR=ON -DDEFAULT_ES=2 -DUSE_ANDROID_LOG=ON >> /tmp/gl4es-build.log 2>&1 &&
          cmake --build /tmp/gl4es/build -j4 >> /tmp/gl4es-build.log 2>&1
          RC=$?
          F=$(ls /tmp/gl4es/lib/libGL.so* 2>/dev/null | head -1)
          if [ $RC -eq 0 ] && [ -n "$F" ]; then
            cp -L "$F" "$OUT/libgl4es.so"
            echo "::notice::gl4es built: $(ls -la $OUT/libgl4es.so)"
          else
            echo "::warning::gl4es build failed rc=$RC: $(tail -c 1500 /tmp/gl4es-build.log | tr '\n' '|')"
          fi

      - name: Build LWJGL2 compatibility layer (old Minecraft versions)
        continue-on-error: true
        run: |
          set -e
          M=https://repo1.maven.org/maven2
          mkdir -p /tmp/l3 app/src/main/assets
          for a in lwjgl lwjgl-glfw lwjgl-opengl lwjgl-openal; do
            curl -fsSL "$M/org/lwjgl/$a/3.3.3/$a-3.3.3.jar" -o "/tmp/l3/$a.jar"
          done
          curl -fsSL "$M/org/ow2/asm/asm/9.7/asm-9.7.jar" -o /tmp/asm.jar
          bash lwjgl2compat/build.sh /tmp/l3 /tmp/asm.jar "$PWD/app/src/main/assets/lwjgl2compat.jar"

      - name: Prepare signing key (from GitHub Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/mobilix.keystore
            echo "SIGNED_OK=yes" >> "$GITHUB_ENV"
          else
            echo "::warning::Secrets KEYSTORE_B64 / KEYSTORE_PASSWORD are missing: building with a throwaway key (the APK will NOT update an installed Mobilix) and skipping the release"
            rm -f app/mobilix.keystore
            keytool -genkeypair -keystore app/mobilix.keystore -alias mobilix -keyalg RSA -keysize 2048 -validity 30 -storepass throwaway -keypass throwaway -dname "CN=throwaway" >/dev/null 2>&1
            echo "KEYSTORE_PASSWORD=throwaway" >> "$GITHUB_ENV"
            echo "SIGNED_OK=no" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-throwaway}" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle assembleRelease --no-daemon

      - name: Name the APK
        run: |
          NAME="Mobilix-launcher-v-$(cat VERSION)"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/$NAME.apk"
          echo "NAME=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.NAME }}
          path: out/*.apk

      - name: GitHub release (important versions only)
        if: env.SIGNED_OK == 'yes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(cat VERSION | tr -d '[:space:]')"
          TAG="APK-$VER"
          if [ -f RELEASE_NOTES.md ] && head -1 RELEASE_NOTES.md | grep -qx "version: $VER"; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "release $TAG already exists"
            else
              tail -n +2 RELEASE_NOTES.md > /tmp/notes.md
              gh release create "$TAG" "out/$NAME.apk" --target "$GITHUB_SHA" --title "Mobilix Launcher $VER" --notes-file /tmp/notes.md
            fi
          else
            echo "no release notes for $VER, skipping release"
          fi
